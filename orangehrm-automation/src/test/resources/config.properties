# =============================================
# OrangeHRM Automation - Cấu hình môi trường
# =============================================

# URL hệ thống OrangeHRM Demo
base.url=https://opensource-demo.orangehrmlive.com/web/index.php

# Thông tin đăng nhập Admin
admin.username=Admin
admin.password=admin123

# Cấu hình trình duyệt
browser=chrome
headless=false

# Timeout (giây)
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# Đường dẫn lưu screenshot khi test thất bại
screenshot.path=screenshots/

# Đường dẫn báo cáo ExtentReport
report.path=reports/
report.name=OrangeHRM_TestReport.html

# Cấu hình test data
test.data.path=src/test/resources/testdata/
